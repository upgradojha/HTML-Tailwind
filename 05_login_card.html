<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="w-96 bg-white p-8 rounded-2xl shadow-xl m-8">
      <h2 class="text-2xl font-bold text-gray-800">Login to your account</h2>
      <input type="email" placeholder="Email" class="mt-6 w-full border border-gray-300 rounded-xl p-2">
      <input type="password" placeholder="password" class="mt-2 w-full p-2 border border-gray-300 rounded-xl">
      <button class="mt-6 w-full h-12 bg-blue-600 text-white rounded-2xl font-semibold hover:bg-blue-700">Login</button>
    </div>
  </body>
</html>
